name: Maple
kind: company
description: >-
  Maple is a Canadian virtual-care company (getmaple.ca) headquartered in Toronto that
  connects patients across every Canadian province to Canadian-licensed doctors and nurse
  practitioners for on-demand and scheduled telehealth. Its consumer membership and B2B
  programs cover same-day acute care, paediatrics, mental health therapy and psychiatry,
  specialist consultations, chronic-condition management, prescriptions with pickup or
  delivery, lab requisitions, and medical notes, delivered through iOS, Android, and web
  apps. Maple sells to individuals and to employers, insurers, and health systems (clients
  include Air Canada, Blue Cross, Rogers, and Green Shield) via custom care programs rather
  than a self-serve technical platform. As of this review Maple publishes NO public developer
  portal, REST API, or HL7 FHIR endpoint; there is no documented CapabilityStatement or
  SMART-on-FHIR configuration. Its interoperability posture is enterprise/partner-gated, and
  its security program is SOC 2 Type II and ISO 27001 aligned with a responsible-disclosure
  channel at security@getmaple.ca.
